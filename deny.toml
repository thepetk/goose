[advisories]

# Deny yanked crates to catch supply chain issues early.
yanked = "deny"
# Emulate cargo-audit which only checks vulnerabilities and yanked crates, not unmaintained/unsound.
unmaintained = "none"
unsound = "none"

# docx-rs requires zip 8 but only reads or writes individual archive entries;
# it does not call ZipArchive::extract or ZipStreamReader::extract. Goose uses zip 9.
# Reassess if docx-rs or its zip callers change. Reviewed version: docx-rs 0.4.22.
# Remove when a docx-rs release supporting zip 9 is available:
# https://github.com/bokuweb/docx-rs/issues/943
[[advisories.ignore]]
id = "RUSTSEC-2026-0367"
reason = "The reviewed dependents do not call the extraction helpers that preserve privileged Unix permission bits."

[[advisories.ignore]]
id = "RUSTSEC-2026-0368"
reason = "The reviewed dependents do not call the extraction helpers that create archive symlinks."

[[advisories.ignore]]
id = "RUSTSEC-2026-0369"
reason = "The reviewed dependents do not call the extraction helpers that apply permissions through symlinks."
